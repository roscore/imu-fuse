[package]
name = "if_web"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
if_core = { path = "../if_core" }
wasm-bindgen = "0.2"
js-sys = "0.3"

[dependencies.web-sys]
version = "0.3"
features = [
  "console", "Window", "Document", "Node", "NodeList", "Element", "HtmlElement", "HtmlCanvasElement",
  "CanvasRenderingContext2d", "TextMetrics", "Event", "EventTarget", "PointerEvent", "MouseEvent",
  "WheelEvent", "Navigator", "MediaQueryList", "CssStyleDeclaration", "DomTokenList",
  "WebGl2RenderingContext", "WebGlProgram", "WebGlShader", "WebGlBuffer", "WebGlVertexArrayObject",
  "WebGlUniformLocation", "WebGlContextAttributes",
]
